<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws: http://localhost:* http://127.0.0.1:*">
    <title>Tecleo Moderno - Typing Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    
    <div id="mascot-container" class="ai-neon">
      <div id="cybot-bubble" class="speech-bubble"></div>
      <div id="cybot" class="cybot state-idle">
        <div class="cybot-head">
          <div class="cybot-eye left"></div>
          <div class="cybot-eye right"></div>
          <div class="cybot-mouth"></div>
        </div>
        <div class="cybot-body"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
